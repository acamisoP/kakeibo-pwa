<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#010101">
<title>kakeibo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* One UI風: 上=表示 / 下=操作(親指ゾーン)、大きな角丸、One UIブルー */
  :root {
    --bg: #010101;
    --card: #171717;
    --card2: #232323;
    --text: #fafafa;
    --sub: #8e8e93;
    --accent: #0381fe;
    --ok: #23c562;
    --err: #ff6363;
    --radius: 26px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'SamsungOne', Roboto, 'Noto Sans JP', sans-serif; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  .screen { display: none; min-height: 100%; padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .screen.active { display: flex; flex-direction: column; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 22px;
  }

  /* ---- 待機画面 ---- */
  #scr-idle { gap: 14px; }
  .app-title { font-size: 24px; font-weight: 800; padding: 26px 6px 8px; letter-spacing: .3px; }
  .app-title span { color: var(--accent); }
  #summary-card .label { color: var(--sub); font-size: 14px; margin-bottom: 8px; }
  #summary-amount { font-size: 40px; font-weight: 800; letter-spacing: .5px; }
  #summary-sub { color: var(--sub); font-size: 13px; margin-top: 8px; }
  #conn { font-size: 12px; color: var(--sub); padding: 2px 8px; }
  #conn.ok { color: var(--ok); } #conn.err { color: var(--err); }
  .flex-spacer { flex: 1; }
  .spacer-sm { flex: 1.3; } /* カードを画面中央やや下(親指が届く高さ)に置くための下側余白 */
  /* 撮影/フォルダ読込: 同サイズ2カード(親指ゾーン)。アイコンのみ・テキストなし */
  #action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .action-card {
    border-radius: var(--radius); padding: 36px 0;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .action-card:active { filter: brightness(1.15); }
  .action-card svg { width: 46px; height: 46px; }
  #capture-card { background: linear-gradient(135deg, var(--accent), #045ecb); }
  #folder-card { background: var(--card2); }

  /* ---- 一括読み込み ---- */
  #scr-batch { gap: 12px; }
  #batch-progress .label { color: var(--sub); font-size: 13px; margin-bottom: 6px; }
  #batch-progress .stat { font-size: 22px; font-weight: 800; }
  #batch-list { display: flex; flex-direction: column; gap: 8px; }
  .b-row { display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 16px; padding: 13px 16px; }
  .b-row .n { flex: 1; font-size: 15px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b-row .a { color: var(--sub); font-size: 14px; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 100px; padding: 4px 10px; flex: none; }
  .badge.created { background: #0f3d22; color: var(--ok); }
  .badge.merged { background: #0b2f56; color: #6ab2ff; }
  .badge.duplicate { background: #2e2e33; color: var(--sub); }
  .badge.review { background: #4a3413; color: #ffb454; }
  .badge.error { background: #442020; color: var(--err); }
  .badge.working { background: #26303d; color: #9ec7ff; }
  .b-row.editable { outline: 1px solid #3a3a40; }
  .b-row.editable:active { filter: brightness(1.35); }

  /* ---- 処理中画面 ---- */
  #scr-busy { align-items: center; justify-content: center; text-align: center; gap: 20px; }
  #thumb { max-width: 62vw; max-height: 34vh; border-radius: 18px; border: 1px solid #2c2c2c; }
  #busy-status { font-size: 18px; line-height: 1.7; white-space: pre-line; }
  #busy-status.err { color: var(--err); font-size: 15px; }

  /* ---- 編集画面 ---- */
  #scr-edit { gap: 12px; }
  #brand { display: none; align-items: center; gap: 12px; padding: 18px 6px 2px; }
  #brand-logo { width: 40px; height: 40px; border-radius: 12px; background: #fff; padding: 4px; }
  #brand-name { font-size: 20px; font-weight: 800; }
  label { font-size: 12px; color: var(--sub); display: block; margin: 0 0 5px 4px; }
  input, select {
    background: var(--card2); color: var(--text); border: none; border-radius: 14px;
    padding: 13px 12px; font-size: 16px; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); }
  input[type=number] { text-align: right; }
  .head-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 8px 6px 0; }
  #items { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--card); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .item .r2 { display: grid; grid-template-columns: 96px 1fr 46px; gap: 8px; }
  .del { background: #331d1d; color: var(--err); border: none; border-radius: 12px; font-size: 17px; }
  .btn {
    font-size: 18px; font-weight: 800; color: #fff; background: var(--accent);
    border: none; border-radius: 100px; padding: 17px; width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { filter: brightness(1.15); }
  .btn.secondary { background: #363636; }
  .btn[hidden] { display: none; }
  #ok-bar { position: sticky; bottom: 0; padding: 12px 0 4px;
    background: linear-gradient(transparent, var(--bg) 35%); display: flex; gap: 10px; }

  /* ---- 編集画面のレシート画像(OKバー下)。ピンチで拡大・ドラッグで移動 ---- */
  #rimg-wrap { border-radius: 18px; overflow: hidden; background: #0a0a0a;
    border: 1px solid #2c2c2c; touch-action: none; }
  #rimg { display: block; width: 100%; transform-origin: 0 0; will-change: transform; }
</style>
</head>
<body>
  <!-- 待機: 上=今月サマリー / 下=撮影(親指ゾーン) -->
  <div id="scr-idle" class="screen active">
    <div class="app-title">kakeibo<span>.</span></div>
    <div id="summary-card" class="card">
      <div class="label">今月の支出</div>
      <div id="summary-amount">──</div>
      <div id="summary-sub">読込中…</div>
    </div>
    <div id="conn"></div>
    <div class="flex-spacer"></div>
    <div id="action-row">
      <div id="capture-card" class="action-card" role="button" aria-label="レシートを撮影">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5h2.2L8 5h8l1.8 2.5H20a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
      </div>
      <div id="folder-card" class="action-card" role="button" aria-label="フォルダから一括読み込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="#cfcfd4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5l2 2.5h9a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18z"/><path d="M12 10.5v5M9.8 13.3 12 15.5l2.2-2.2"/></svg>
      </div>
    </div>
    <div class="spacer-sm"></div>
  </div>

  <!-- フォルダ一括読み込みの進捗+結果 -->
  <div id="scr-batch" class="screen">
    <div class="app-title">一括読み込み<span>.</span></div>
    <div id="batch-progress" class="card">
      <div class="label">進捗</div>
      <div class="stat" id="batch-stat">準備中…</div>
    </div>
    <div id="batch-list"></div>
    <div class="flex-spacer"></div>
    <button id="batch-done" class="btn" hidden>完了</button>
  </div>

  <!-- 処理中/エラー -->
  <div id="scr-busy" class="screen">
    <img id="thumb" alt="">
    <div id="busy-status"></div>
    <button id="retry" class="btn secondary" hidden>再送信</button>
    <button id="reshoot" class="btn" hidden>撮り直す</button>
    <button id="backbatch" class="btn secondary" hidden>一覧へ戻る</button>
  </div>

  <!-- OCR結果編集 -->
  <div id="scr-edit" class="screen">
    <div id="brand">
      <img id="brand-logo" alt="">
      <span id="brand-name"></span>
    </div>
    <div class="head-grid">
      <div><label>店舗</label><input id="f-store"></div>
      <div><label>日付</label><input id="f-date" type="date"></div>
      <div><label>合計(円)</label><input id="f-total" type="number" inputmode="numeric"></div>
      <div><label>支払方法</label><select id="f-payment"></select></div>
      <div><label>店舗種別</label><select id="f-storetype"></select></div>
      <div><label>種別</label><select id="f-kind"><option>支出</option><option>収入</option></select></div>
    </div>
    <h2>明細(タップで修正・✕で削除)</h2>
    <div id="items"></div>
    <button id="add-item" class="btn secondary" style="padding:12px;font-size:14px">明細を追加</button>
    <div id="ok-bar">
      <button id="cancel" class="btn secondary" style="flex:0 0 96px">破棄</button>
      <button id="ok" class="btn">OK — 登録して閉じる</button>
    </div>
    <div id="rimg-sec" hidden>
      <h2>レシート画像(ピンチで拡大・ダブルタップでリセット)</h2>
      <div id="rimg-wrap"><img id="rimg" alt="レシート"></div>
    </div>
  </div>

  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <input id="files" type="file" accept="image/*" multiple hidden>
  <script src="app.js?v=8"></script>
</body>
</html>
