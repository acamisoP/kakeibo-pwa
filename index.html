<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>kakeibo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  #app {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  #thumb {
    max-width: 70vw; max-height: 40vh; border-radius: 12px;
    border: 2px solid #333; display: none; object-fit: contain;
  }
  #status { font-size: 20px; line-height: 1.6; white-space: pre-line; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; font-size: 16px; }
  .btn {
    font-size: 22px; font-weight: bold; color: #fff;
    background: #2ea44f; border: none; border-radius: 16px;
    padding: 22px 40px; width: 100%; max-width: 420px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { filter: brightness(1.2); }
  .btn.secondary { background: #444; }
  .btn[hidden] { display: none; }
  #hint { color: #888; font-size: 13px; }
</style>
</head>
<body>
  <div id="app">
    <img id="thumb" alt="撮影したレシート">
    <div id="status">レシートを撮影してください</div>
    <button id="shoot" class="btn">📷 カメラを起動</button>
    <button id="retry" class="btn secondary" hidden>↻ 再送信</button>
    <div id="hint">標準カメラで撮影(フォーカス・ライト自由)→ 確定で自動送信</div>
  </div>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <script src="app.js?v=2"></script>
</body>
</html>
