<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010101">
<title>内訳入力 — kakeibo</title>
<link rel="icon" href="icons/icon-192.png">
<!-- manifestは意図的に付けない: カメラPWAのscope内の1ページとして開く(通知タップ用) -->
<style>
  :root {
    --bg: #010101; --card: #171717; --card2: #232323;
    --text: #fafafa; --sub: #8e8e93; --accent: #0381fe;
    --ok: #23c562; --err: #ff6363; --radius: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'SamsungOne', Roboto, 'Noto Sans JP', sans-serif; }
  html, body { background: var(--bg); color: var(--text); min-height: 100%; }
  body { padding: 20px; padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: 120px; }
  .app-title { font-size: 22px; font-weight: 800; padding: 10px 6px 4px; }
  .app-title span { color: var(--accent); }
  .lead { color: var(--sub); font-size: 13px; padding: 0 6px 16px; line-height: 1.6; }

  .na-card { background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px; transition: outline .15s; outline: 2px solid transparent; }
  .na-card.focus { outline: 2px solid var(--accent); }
  .na-card.done { opacity: .78; }
  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .head .d { color: var(--sub); font-size: 12px; }
  .head .s { font-weight: 700; font-size: 15px; flex: 1; min-width: 40%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .a { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .head .p { color: var(--sub); font-size: 11px; background: var(--card2);
    border-radius: 100px; padding: 3px 9px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; background: var(--card2); color: var(--text); border: none;
    border-radius: 13px; padding: 13px 14px; font-size: 16px; min-width: 0; }
  .row input:focus { outline: 2px solid var(--accent); }
  .st { flex: none; width: 34px; text-align: center; font-size: 17px; color: var(--sub); }
  .st.ok { color: var(--ok); font-weight: 800; }
  .st.err { color: var(--err); }
  .genre { margin-top: 8px; font-size: 12px; color: var(--sub); padding-left: 4px; min-height: 15px; }

  .empty { text-align: center; color: var(--sub); padding: 60px 20px; line-height: 2; }
  .empty svg { width: 44px; height: 44px; margin-bottom: 10px; stroke: #494950; }
  .empty .big { font-size: 16px; font-weight: 700; color: var(--text); }
  .retry-btn { display: block; margin: 18px auto 0; padding: 13px 40px; border: none;
    border-radius: 100px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 800; -webkit-tap-highlight-color: transparent; }
  .retry-btn:active { filter: brightness(1.15); }

  /* 下部固定: ↑↓でカード移動 */
  #navbar { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 20px max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 40%);
    display: flex; gap: 10px; align-items: center; }
  #navbar .count { flex: 1; color: var(--sub); font-size: 13px; padding-left: 6px; }
  .nav-btn { width: 64px; height: 48px; border: none; border-radius: 100px;
    background: var(--card2); color: var(--text); font-size: 18px;
    -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; }
  .nav-btn:active { filter: brightness(1.3); }
  .nav-btn svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <div class="app-title">内訳入力<span>.</span></div>
  <div class="lead">直近2日の「何に使ったか不明」な支出です。内訳を入力してEnterを押すと保存して次へ移動します。</div>
  <div id="list"><div class="empty">読込中…</div></div>

  <div id="navbar" hidden>
    <div class="count" id="count"></div>
    <button class="nav-btn" id="nav-up" aria-label="前のカードへ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
    </button>
    <button class="nav-btn" id="nav-down" aria-label="次のカードへ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 10 6 6 6-6"/></svg>
    </button>
  </div>

<script>
const GAS_URL = (() => {
  const q = new URLSearchParams(location.search).get('gas');
  if (q) { localStorage.setItem('kakeibo_gas_url', q); history.replaceState(null, '', location.pathname); }
  return localStorage.getItem('kakeibo_gas_url') || '';
})();
const $ = id => document.getElementById(id);
let cards = [];   // {itemId, input, st, genre, card, saved, lastSaved}

const SVG_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

async function fetchJson(url, opts, timeoutMs) {
  const c = new AbortController();
  const to = setTimeout(() => c.abort(), timeoutMs || 30000);
  try {
    const r = await fetch(url, Object.assign({ signal: c.signal, redirect: 'follow' }, opts || {}));
    return await r.json();
  } finally { clearTimeout(to); }
}

async function load(isRetry) {
  if (!GAS_URL) {
    $('list').innerHTML = '<div class="empty">サーバー未設定です。<br>先にカメラアプリを ?gas=&lt;WebアプリURL&gt; 付きで一度開いてください。</div>';
    return;
  }
  let j = null;
  try { j = await fetchJson(GAS_URL + '?na=list'); } catch (e) { }
  if (!j || !j.ok) {
    // GAS初回応答は稀にこける(一過性)ので、1回だけ自動で再試行してから手動ボタンを出す
    if (!isRetry) {
      $('list').innerHTML = '<div class="empty">読込中…(再試行しています)</div>';
      await new Promise(r => setTimeout(r, 1500));
      return load(true);
    }
    $('list').innerHTML = '<div class="empty">一覧を取得できませんでした。' +
      '<button class="retry-btn" id="reload">再試行</button></div>';
    document.getElementById('reload').onclick = () => {
      $('list').innerHTML = '<div class="empty">読込中…</div>';
      load();
    };
    return;
  }
  if (!j.items.length) {
    $('list').innerHTML = '<div class="empty">' + SVG_DONE +
      '<div class="big">直近2日のN/Aはありません</div>すべて記入済みです。</div>';
    return;
  }
  render(j.items);
}

function render(items) {
  const list = $('list');
  list.innerHTML = '';
  cards = [];
  items.forEach((na, idx) => {
    const card = document.createElement('div');
    card.className = 'na-card';
    card.innerHTML =
      '<div class="head"><span class="d">' + esc(na.date) + '</span>' +
      '<span class="s">' + esc(na.store) + '</span>' +
      (na.payment ? '<span class="p">' + esc(na.payment) + '</span>' : '') +
      '<span class="a">¥' + Number(na.amount).toLocaleString('ja-JP') + '</span></div>';
    const row = document.createElement('div');
    row.className = 'row';
    const input = document.createElement('input');
    input.placeholder = '何に使った?(例: 昼食のコンビニ弁当)';
    input.enterKeyHint = idx === items.length - 1 ? 'done' : 'next';
    const st = document.createElement('div');
    st.className = 'st';
    row.append(input, st);
    const genre = document.createElement('div');
    genre.className = 'genre';
    card.append(row, genre);
    list.appendChild(card);

    const entry = { itemId: na.itemId, input, st, genre, card, saving: false, lastSaved: '' };
    cards.push(entry);
    input.addEventListener('focus', () => setFocus(idx, false));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); saveAndMove(idx, +1); }
    });
  });
  $('navbar').hidden = false;
  updateCount();
  setFocus(0, true);
  $('nav-up').onclick = () => saveAndMove(curIdx, -1);
  $('nav-down').onclick = () => saveAndMove(curIdx, +1);
}

let curIdx = 0;
function setFocus(idx, scroll) {
  curIdx = Math.max(0, Math.min(cards.length - 1, idx));
  cards.forEach((c, i) => c.card.classList.toggle('focus', i === curIdx));
  const c = cards[curIdx];
  if (scroll) c.card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  c.input.focus({ preventScroll: !scroll });
}

function updateCount() {
  const done = cards.filter(c => c.card.classList.contains('done')).length;
  $('count').textContent = done + ' / ' + cards.length + ' 件入力済み';
}

/** 現在カードを保存(空/未変更ならスキップ)して dir 方向の隣へ */
async function saveAndMove(idx, dir) {
  const c = cards[idx];
  const name = c.input.value.trim();
  if (name && name !== c.lastSaved && !c.saving) save(c, name);
  const next = idx + dir;
  if (next >= 0 && next < cards.length) setFocus(next, true);
  else if (name) c.input.blur();
}

async function save(c, name) {
  c.saving = true;
  c.st.className = 'st'; c.st.textContent = '…';
  try {
    const j = await fetchJson(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ mode: 'na', itemId: c.itemId, name: name }),
    }, 45000);
    if (!j.ok) throw new Error(j.error || '保存失敗');
    c.lastSaved = name;
    c.st.className = 'st ok'; c.st.textContent = '✓';
    c.card.classList.add('done');
    c.genre.textContent = j.genre ? 'ジャンル: ' + j.genre : '';
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    c.st.className = 'st err'; c.st.textContent = '✗';
    c.genre.textContent = '保存に失敗しました。もう一度Enterで再送します';
    c.lastSaved = '';
  } finally {
    c.saving = false;
    updateCount();
  }
}

load();
</script>
</body>
</html>
