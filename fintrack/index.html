<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#010101">
<title>FinTrack</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* ============ One UI トークン(カメラ版と共通)+ モーション定義 ============ */
  :root {
    --bg: #010101;
    --card: #171717;
    --card2: #232323;
    --card3: #2e2e2e;
    --text: #fafafa;
    --sub: #8e8e93;
    --accent: #0381fe;
    --accent2: #3ea8ff;
    --ok: #23c562;
    --err: #ff6363;
    --radius: 26px;
    --ease: cubic-bezier(0.22, 0.25, 0, 1);
    --spring: cubic-bezier(0.34, 1.36, 0.3, 1);
    --nav-h: 64px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'SamsungOne', Roboto, 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body { overflow: hidden; }
  button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }

  /* ---- ヘッダー ---- */
  #hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: max(14px, env(safe-area-inset-top)) 20px 10px;
    background: linear-gradient(rgba(1,1,1,.96), rgba(1,1,1,.88));
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .hdr-row { display: flex; align-items: center; justify-content: space-between; }
  .app-title { font-size: 24px; font-weight: 800; letter-spacing: .3px; }
  .app-title span { color: var(--accent); }
  #sync { font-size: 11px; color: var(--sub); opacity: 0; transition: opacity .25s var(--ease); }
  #sync.on { opacity: 1; }
  #sync.done { color: var(--ok); }

  /* 月ページャ(取引・分析で共有) */
  #pager { display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-top: 8px; height: 40px; visibility: hidden; }
  #pager.show { visibility: visible; }
  .pg-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--card);
    font-size: 20px; color: var(--text); line-height: 1;
    transition: transform .18s var(--spring), opacity .2s, background .2s; }
  .pg-btn:active { transform: scale(.88); background: var(--card2); }
  .pg-btn:disabled { opacity: .25; }
  .pg-clip { height: 28px; min-width: 128px; overflow: hidden; position: relative; text-align: center; }
  .pg-label { font-size: 17px; font-weight: 700; line-height: 28px; white-space: nowrap; }
  .pg-label.abs { position: absolute; left: 0; right: 0; }
  @keyframes pgOutUp   { to { transform: translateY(-100%); opacity: 0; } }
  @keyframes pgInUp    { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pgOutDown { to { transform: translateY(100%); opacity: 0; } }
  @keyframes pgInDown  { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
  .pg-out-up   { animation: pgOutUp   .24s var(--ease) both; }
  .pg-in-up    { animation: pgInUp    .24s var(--ease) both; }
  .pg-out-down { animation: pgOutDown .24s var(--ease) both; }
  .pg-in-down  { animation: pgInDown  .24s var(--ease) both; }

  /* ---- メインスクロール領域 ---- */
  #main { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    padding: 0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px); }
  .hdr-pad { height: 118px; }               /* ヘッダー分の余白(ページャ込み) */
  #main::-webkit-scrollbar { display: none; }

  /* プルリフレッシュ */
  #ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 66px); z-index: 19;
    width: 40px; height: 40px; margin-left: -20px; border-radius: 50%;
    background: var(--card2); box-shadow: 0 4px 14px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(-56px); pointer-events: none; }
  #ptr svg { width: 22px; height: 22px; stroke: var(--accent); }
  #ptr.spin svg { animation: spin .8s linear infinite; }
  #ptr.settle { transition: transform .3s var(--ease), opacity .3s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- ビュー切替(横スライド+フェード) ---- */
  .view { display: none; }
  .view.active { display: block; }
  @keyframes vInL { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  @keyframes vInR { from { opacity: 0; transform: translateX(26px); }  to { opacity: 1; transform: none; } }
  .view.in-l { animation: vInL .25s var(--ease) both; }
  .view.in-r { animation: vInR .25s var(--ease) both; }

  /* ---- カード ---- */
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; }
  .label { color: var(--sub); font-size: 13px; font-weight: 600; }
  .sub { color: var(--sub); font-size: 12px; }
  .row-label { display: flex; align-items: center; justify-content: space-between;
    color: var(--sub); font-size: 13px; font-weight: 700; margin: 22px 6px 10px; }
  .row-label button { color: var(--accent); font-size: 13px; font-weight: 700; }

  /* ---- ホーム ---- */
  #view-home > .hero { margin-top: 6px; padding: 24px 22px; }
  .hero-amount { font-size: 44px; font-weight: 800; letter-spacing: .5px; margin: 10px 0 6px;
    font-variant-numeric: tabular-nums; }
  .wd { margin-top: 12px; display: flex; align-items: center; gap: 16px; }
  .wd-body { flex: 1; }
  .wd-title { font-size: 17px; font-weight: 800; margin-bottom: 5px; }
  .wd-sub { font-size: 13px; color: var(--sub); line-height: 1.5; }
  .wd-ring { position: relative; width: 74px; height: 74px; flex: none; }
  .wd-ring svg { transform: rotate(-90deg); }
  .wd-ring circle { fill: none; stroke-width: 7; }
  .wd-ring .bgc { stroke: var(--card3); }
  .wd-ring .fgc { stroke: var(--accent); stroke-linecap: round;
    transition: stroke-dashoffset .9s var(--ease); }
  .wd-ring .pct { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 800; }

  .paycards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity;
    margin: 0 -16px; padding: 2px 16px 6px; }
  .paycards::-webkit-scrollbar { display: none; }
  .paycard { flex: none; scroll-snap-align: start; min-width: 138px;
    background: var(--card); border-radius: 22px; padding: 16px; }
  .paycard .ic { font-size: 22px; }
  .paycard .nm { color: var(--sub); font-size: 12px; font-weight: 600; margin: 10px 0 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paycard .amt { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* ---- 取引リスト ---- */
  .pills { position: relative; display: flex; background: var(--card);
    border-radius: 100px; padding: 4px; margin-top: 6px; }
  .pills button { flex: 1; position: relative; z-index: 1; padding: 10px 0;
    font-size: 14px; font-weight: 700; color: var(--sub); transition: color .2s; }
  .pills button.on { color: #fff; }
  #pill-ind { position: absolute; top: 4px; bottom: 4px; width: calc((100% - 8px) / 3);
    left: 4px; background: var(--accent); border-radius: 100px;
    transition: transform .25s var(--spring); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--card);
    border-radius: 100px; padding: 12px 18px; margin-top: 10px; }
  .search svg { width: 17px; height: 17px; stroke: var(--sub); flex: none; }
  .search input { background: none; border: none; outline: none; color: var(--text);
    font-size: 15px; width: 100%; }
  .search input::placeholder { color: #5c5c60; }

  .tgroup { margin-top: 18px; }
  .tgroup-h { display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 8px 8px; }
  .tgroup-h .d { font-size: 13px; font-weight: 700; color: var(--sub); }
  .tgroup-h .t { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .tgroup .card { padding: 6px 8px; }
  .trow { display: flex; align-items: center; gap: 13px; padding: 11px 10px;
    border-radius: 18px; transition: background .15s; }
  .trow:active { background: var(--card2); }
  .trow .ic { width: 44px; height: 44px; flex: none; border-radius: 15px;
    background: var(--card2); display: flex; align-items: center; justify-content: center;
    font-size: 21px; }
  .trow .mid { flex: 1; min-width: 0; }
  .trow .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .trow .dt { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .trow .amt { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
  .trow .amt.inc { color: var(--ok); }

  /* カスケード出現(初回のみJSで付与) */
  @keyframes popUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .pop { animation: popUp .32s var(--ease) both; }

  .empty { text-align: center; color: var(--sub); padding: 56px 0 30px; font-size: 14px; }
  .empty .big { font-size: 40px; margin-bottom: 12px; }

  /* ---- 分析 ---- */
  #view-an .card { margin-top: 12px; }
  #view-an .card:first-child { margin-top: 6px; }
  .donut-wrap { position: relative; width: 216px; height: 216px; margin: 18px auto 8px; }
  .donut-wrap svg { width: 100%; height: 100%; }
  .donut-wrap svg circle.seg { fill: none; stroke-width: 26;
    transition: stroke-dasharray .7s var(--ease); }
  .donut-c { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; }
  .donut-c .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .legend { margin-top: 14px; display: flex; flex-direction: column; gap: 13px; }
  .lg-row .top { display: flex; align-items: center; gap: 9px; }
  .lg-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .lg-row .g { font-size: 14px; font-weight: 600; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg-row .p { font-size: 12px; color: var(--sub); margin-right: 8px; }
  .lg-row .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lg-row .bar { height: 5px; border-radius: 3px; background: var(--card3);
    margin: 7px 0 0 18px; overflow: hidden; }
  .lg-row .bar i { display: block; height: 100%; border-radius: 3px;
    transform: scaleX(0); transform-origin: left;
    transition: transform .6s var(--ease); }
  .lg-row .bar i.grow { transform: scaleX(1); }

  .trend { display: flex; align-items: flex-end; gap: 6px; height: 148px;
    margin-top: 18px; padding: 0 2px; }
  .tbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;
    min-width: 0; }
  .tbar .col { width: 100%; max-width: 22px; border-radius: 7px; background: var(--card3);
    transform: scaleY(0); transform-origin: bottom;
    transition: transform .55s var(--ease); }
  .tbar .col.grow { transform: scaleY(1); }
  .tbar.cur .col { background: var(--accent); }
  .tbar .m { font-size: 10px; color: var(--sub); }
  .tbar.cur .m { color: var(--accent); font-weight: 700; }
  .tbar .v { font-size: 9px; color: var(--sub); height: 12px; white-space: nowrap; }
  .tbar.cur .v { color: var(--text); font-weight: 700; }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .duo .card { margin-top: 0 !important; padding: 18px; }
  .duo .v { font-size: 21px; font-weight: 800; margin: 8px 0 5px;
    font-variant-numeric: tabular-nums; }
  .duo .d { font-size: 12px; font-weight: 700; }
  .duo .d.up { color: var(--err); }
  .duo .d.down { color: var(--ok); }
  .duo .d.flat { color: var(--sub); }

  /* ---- ボトムシート ---- */
  #sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  #sheet-back.on { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    background: #1c1c1e; border-radius: 26px 26px 0 0;
    max-height: 84vh; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .32s var(--spring);
    padding-bottom: env(safe-area-inset-bottom); }
  #sheet.on { transform: translateY(0); }
  #sheet.drag { transition: none; }
  .grip { width: 38px; height: 4px; border-radius: 2px; background: #48484c;
    margin: 10px auto 2px; flex: none; }
  #sheet-body { overflow-y: auto; padding: 10px 22px 22px; }
  .sh-title { font-size: 20px; font-weight: 800; line-height: 1.4; }
  .sh-amt { font-size: 34px; font-weight: 800; margin: 6px 0 12px;
    font-variant-numeric: tabular-nums; }
  .sh-amt.inc { color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .chip { background: var(--card2); color: #cfcfd4; border-radius: 100px;
    font-size: 12px; font-weight: 600; padding: 7px 13px; }
  .chip.g { color: #fff; }
  .sh-items { background: var(--card); border-radius: 20px; padding: 6px 16px; margin-bottom: 16px; }
  .sh-item { display: flex; align-items: center; gap: 10px; padding: 11px 0;
    border-bottom: 1px solid #242427; }
  .sh-item:last-child { border-bottom: none; }
  .sh-item .nm { flex: 1; min-width: 0; font-size: 14px; }
  .sh-item .q { color: var(--sub); font-size: 12px; flex: none; }
  .sh-item .pr { font-size: 14px; font-weight: 700; flex: none; font-variant-numeric: tabular-nums; }
  .sh-item.total { font-weight: 800; }
  .sh-actions { display: flex; gap: 10px; }
  .sh-btn { flex: 1; border-radius: 100px; padding: 15px; font-size: 15px; font-weight: 800;
    text-align: center; transition: filter .15s, transform .15s; }
  .sh-btn:active { filter: brightness(1.2); transform: scale(.98); }
  .sh-btn.pri { background: var(--accent); color: #fff; }
  .sh-btn.sec { background: var(--card2); color: var(--text); }
  .sh-btn:disabled { opacity: .5; }

  /* ---- 下部ナビ ---- */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding: 6px 10px env(safe-area-inset-bottom);
    background: rgba(12,12,13,.94); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid #1d1d1f; display: flex; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; color: var(--sub); font-size: 11px; font-weight: 700;
    transition: color .2s; }
  .nav-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .2s var(--spring); }
  .nav-btn.on { color: var(--accent); }
  .nav-btn.on svg { transform: translateY(-1px) scale(1.06); }
  .nav-btn:active svg { transform: scale(.85); }

  /* ---- スケルトン ---- */
  .sk { border-radius: 14px; background: linear-gradient(90deg, #191919 25%, #242424 40%, #191919 60%);
    background-size: 300% 100%; animation: shimmer 1.3s infinite linear; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* ---- トースト ---- */
  #toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(16px);
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px); z-index: 40;
    background: #2a2a2e; color: var(--text); font-size: 13px; font-weight: 600;
    border-radius: 100px; padding: 12px 20px; opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    max-width: 86vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- 初期設定画面 ---- */
  #setup { position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: none; align-items: center; justify-content: center; padding: 28px; }
  #setup.on { display: flex; }
  #setup .card { max-width: 420px; }
  #setup h1 { font-size: 22px; margin-bottom: 14px; }
  #setup p { color: var(--sub); font-size: 14px; line-height: 1.9; }
  #setup code { background: var(--card2); border-radius: 8px; padding: 2px 8px;
    font-size: 12px; color: var(--accent2); }

  /* ---- アクセシビリティ: モーション低減 ---- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<header id="hdr">
  <div class="hdr-row">
    <div class="app-title">FinTrack<span>.</span></div>
    <div id="sync"></div>
  </div>
  <div id="pager">
    <button id="pg-prev" class="pg-btn" aria-label="前の月">‹</button>
    <div class="pg-clip"><div id="pg-label" class="pg-label"></div></div>
    <button id="pg-next" class="pg-btn" aria-label="次の月">›</button>
  </div>
</header>

<div id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round">
  <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg></div>

<main id="main">
  <div class="hdr-pad"></div>

  <!-- ホーム(常に今月) -->
  <section id="view-home" class="view active"></section>

  <!-- 取引 -->
  <section id="view-tx" class="view"></section>

  <!-- 分析 -->
  <section id="view-an" class="view"></section>
</main>

<nav id="nav">
  <button class="nav-btn on" data-v="home">
    <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4.3l8 6.9V20a1 1 0 0 1-1 1h-4.6v-5.8H9.6V21H5a1 1 0 0 1-1-1z"/></svg>
    ホーム</button>
  <button class="nav-btn" data-v="tx">
    <svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-3-1.8-3 1.8-3-1.8L7 21l-2-1.2V4.5a1 1 0 0 1 1-1z"/><path d="M9 9h6M9 13h4"/></svg>
    取引</button>
  <button class="nav-btn" data-v="an">
    <svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>
    分析</button>
</nav>

<div id="sheet-back"></div>
<div id="sheet">
  <div class="grip"></div>
  <div id="sheet-body"></div>
</div>

<div id="toast"></div>

<div id="setup">
  <div class="card">
    <h1>FinTrack<span style="color:var(--accent)">.</span> の初期設定</h1>
    <p>サーバーURLが未設定です。<br>
    <code>?gas=&lt;WebアプリURL&gt;</code> を付けたリンクからこのページを一度開いてください。<br><br>
    kakeiboカメラ版を同じ端末・同じブラウザで設定済みの場合は自動で引き継がれます。</p>
  </div>
</div>

<script src="app.js?v=1"></script>
</body>
</html>
