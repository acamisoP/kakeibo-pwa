<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010101">
<title>FinTrackは移転しました</title>
<script>
// FinTrackは https://acamisop.github.io/fintrack/ へ移転(カメラ版PWAのscope衝突回避)。
// 旧SW・旧キャッシュを掃除してから ?gas= 等のクエリを保持したまま転送する。
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch (e) { }
  location.replace('https://acamisop.github.io/fintrack/' + location.search);
})();
</script>
</head>
<body style="background:#010101;color:#8e8e93;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:24px">
<p>FinTrackは <a style="color:#0381fe;font-weight:700" href="https://acamisop.github.io/fintrack/">acamisop.github.io/fintrack</a> へ移転しました。転送中…</p>
</body>
</html>
